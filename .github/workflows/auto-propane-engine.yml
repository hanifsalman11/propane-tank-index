name: Autonomous Propane Tank Vaporization & CSST Pipe Sizing Engine

on:
  schedule:
    - cron: '36 */6 * * *'
  workflow_dispatch:
    inputs:
      custom_propane:
        description: 'Optional Propane Heater or Tank Scenario (e.g. Mr. Heater Big Maxx 80000 BTU)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate-propane-calculators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Propane Calculators & Ping Search Engines
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PAGES_PER_RUN: '3'
          CUSTOM_PROPANE: ${{ github.event.inputs.custom_propane || '' }}
        run: |
          python engine/propane_builder.py

      - name: Self-Healing Commit & Push to Trigger GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/published_propane.json
          if git diff --staged --quiet; then
            echo "No new propane calculator pages to commit."
          else
            git commit -m "chore(propane): auto-publish new propane vaporization & CSST pipe calculators"
            for i in 1 2 3; do
              git pull --rebase origin main || true
              if git push origin main; then
                echo "Pushed successfully on attempt $i"
                break
              fi
              sleep 5
            done
          fi
